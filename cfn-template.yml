AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda API with multiple endpoints (Hello, GetUser, ScanUsers)

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda zip
  LambdaCodeKey:
    Type: String
    Description: S3 key for Lambda zip

Resources:
  # ---------------------------
  # SQS Queue for Notifications
  # ---------------------------
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: user-notification-queue
      VisibilityTimeout: 60

  # ---------------------------
  # IAM Role for all Lambdas
  # ---------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: app-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      LambdaConfig:
        DefineAuthChallenge: !GetAtt DefineAuthChallengeLambdaFunction.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeLambdaFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeLambdaFunction.Arn

  
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: app-client-spa
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
        

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${LambdaCodeBucket}/*
        
        - PolicyName: LambdaDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem

                Resource:
                  - arn:aws:dynamodb:ap-southeast-2:689295100099:table/usersTable
                  - arn:aws:dynamodb:ap-southeast-2:689295100099:table/usersTable/index/email-index
                  - arn:aws:dynamodb:ap-southeast-2:689295100099:table/usersTable/index/mobile-index
                  - arn:aws:dynamodb:ap-southeast-2:689295100099:table/usersTable/index/documentSubmitted-userId-index
                  - arn:aws:dynamodb:ap-southeast-2:689295100099:table/usersTable/index/cognito-index

        - PolicyName: LambdaSQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt NotificationQueue.Arn

        - PolicyName: LambdaSESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

        - PolicyName: LambdaSNSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"

        - PolicyName: LambdaCognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:InitiateAuth
                Resource: "*"

        - PolicyName: CognitoSignupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                Resource: "*"

  # ---------------------------
  # Lambda Functions
  # ---------------------------
  HelloLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: HelloLambda
      Runtime: nodejs24.x
      Handler: handler/hellolambda.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 10
      MemorySize: 128

  GetUserLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GetUserLambda
      Runtime: nodejs24.x
      Handler: handler/getUsers.getuser
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: usersTable

  ScanUsersLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ScanUsersLambda
      Runtime: nodejs24.x
      Handler: handler/getUsers.scanusers
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: usersTable

  CreateUsersLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CreateUsersLambda
      Runtime: nodejs24.x
      Handler: handler/createUsers.createuser
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: usersTable
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
          USER_POOL_ID: !Ref CognitoUserPool

  UpdateUsersLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: UpdateUsersLambda
      Runtime: nodejs24.x
      Handler: handler/updateUsers.updateuser
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: usersTable
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  
  DeleteUsersLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DeleteUsersLambda
      Runtime: nodejs24.x
      Handler: handler/deleteUsers.deleteuser
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: usersTable

  DocumentUsersLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DocumentUsersLambda
      Runtime: nodejs24.x
      Handler: handler/documentReminderCron.documentReminder
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: usersTable
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  
  DocumentReminderRule:
    Type: AWS::Events::Rule
    Properties:
      Name: document-reminder-cron
      ScheduleExpression: cron(40 4 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt DocumentUsersLambdaFunction.Arn 
          Id: DocumentReminderTarget
          
  DocumentReminderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DocumentUsersLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DocumentReminderRule.Arn


  NotificationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: NotificationLambda
      Runtime: nodejs24.x
      Handler: handler/notification.handler 
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 128
  

  NotificationTrigger:
    Type: AWS::Lambda::EventSourceMapping 
    Properties:
      EventSourceArn: !GetAtt NotificationQueue.Arn
      FunctionName: !Ref NotificationLambdaFunction
      BatchSize: 1
      Enabled: true
  
  LoginUsersLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LoginUsersLambda
      Runtime: nodejs24.x
      Handler: handler/loginUsers.loginHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: usersTable
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient

  DefineAuthChallengeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DefineAuthChallengeLambda
      Runtime: nodejs24.x
      Handler: handler/defineAuthChallenge.authChallenge
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket 
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 128
  
  CreateAuthChallengeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CreateAuthChallengeLambda
      Runtime: nodejs24.x
      Handler: handler/createAuthChallenge.createAuth
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey 
      Timeout: 30
      MemorySize: 128

  VerifyAuthChallengeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: VerifyAuthChallengeLambda
      Runtime: nodejs24.x
      Handler: handler/verifyAuthChallenge.verifyAuth
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: 
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 128

  CustomAuthLoginLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CustomAuthLoginLambda
      Runtime: nodejs24.x
      Handler: handler/customAuthlogin.authLogin
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
  
  VerifyOTPLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: VerifyOTPLambda
      Runtime: nodejs24.x
      Handler: handler/verifyOtp.verifyOtp
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient

  # ---------------------------
  # HTTP API Gateway
  # ---------------------------
  LambdaHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: LambdaHttpApi
      ProtocolType: HTTP

  # ---------------------------
  # API Integrations
  # ---------------------------
  HelloApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HelloLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  GetUserApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUserLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  ScanUsersApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ScanUsersLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'
  
  CreateUsersApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType : AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateUsersLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'
  
  UpdateUsersApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateUsersLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  DeleteUsersApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteUsersLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'
  
  LoginUsersApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginUsersLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  CustomLoginAuthApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomAuthLoginLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'
  
  VerifyOTPApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VerifyOTPLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  # ---------------------------
  # Routes
  # ---------------------------
  HelloApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: GET /hello
      Target: !Sub integrations/${HelloApiIntegration}

  GetUserApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: GET /getuser
      Target: !Sub integrations/${GetUserApiIntegration}

  ScanUsersApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: GET /scanusers
      Target: !Sub integrations/${ScanUsersApiIntegration}
  
  CreateUsersApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: POST /createuser
      Target: !Sub integrations/${CreateUsersApiIntegration}
  
  UpdateUsersApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: PUT /updateuser
      Target: !Sub integrations/${UpdateUsersApiIntegration}

  DeleteUsersApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: DELETE /deleteuser
      Target: !Sub integrations/${DeleteUsersApiIntegration}
  
  LoginUsersApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: POST /loginusers
      Target: !Sub integrations/${LoginUsersApiIntegration}
  
  CustomAuthApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: POST /customauth
      Target: !Sub integrations/${CustomLoginAuthApiIntegration}
  
  VerifyOTPApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LambdaHttpApi
      RouteKey: POST /verifyotp
      Target: !Sub integrations/${VerifyOTPApiIntegration}
  
  # ---------------------------
  # Stage
  # ---------------------------
  LambdaApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref LambdaHttpApi
      StageName: $default
      AutoDeploy: true

  # ---------------------------
  # Lambda Permissions
  # ---------------------------
  HelloLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HelloLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*

  GetUserLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetUserLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*

  ScanUsersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScanUsersLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*

  CreateUsersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateUsersLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*
  
  UpdateUsersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateUsersLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*
  
  DeleteUsersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeleteUsersLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*

  LoginUsersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginUsersLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*
  
  CustomAuthLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CustomAuthLoginLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*
  
  VerifyOTPLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VerifyOTPLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LambdaHttpApi}/*/*

  DefineAuthLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DefineAuthChallengeLambdaFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn
  
  CreateAuthLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateAuthChallengeLambdaFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn
  
  VerifyAuthLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VerifyAuthChallengeLambdaFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn
      
      











